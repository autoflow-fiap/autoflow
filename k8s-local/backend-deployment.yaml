apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoflow-backend
  labels:
    app: autoflow-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoflow-backend
  template:
    metadata:
      labels:
        app: autoflow-backend
    spec:
      containers:
        - name: autoflow-backend-container
          image: autoflow-backend:latest
          imagePullPolicy: Never 
          resources:
            requests:
              cpu: "250m"   
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: autoflow-config
            - secretRef:
                name: autoflow-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            failureThreshold: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            failureThreshold: 3
            timeoutSeconds: 5 
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            timeoutSeconds: 5
            periodSeconds: 30
          
        
