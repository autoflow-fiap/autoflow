spring.application.name=autoflow-backend
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Configurações do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Token JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8081}
app.public-token-secret=${APP_PUBLIC_TOKEN_SECRET:dev-local-secret}
app.public-token-expiration-days=${APP_PUBLIC_TOKEN_EXPIRATION_DAYS:7}
app.frontend-public-base-url=${FRONTEND_PUBLIC_BASE_URL:http://localhost:4200}
# Projeto acadêmico: o frontend pode ser executado em localhost, Docker ou em
# uma URL temporária de laboratório. Como a API não usa cookies/sessão, CORS
# permanece aberto por padrão e credenciais cross-origin ficam desabilitadas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

management.server.port=8081
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.port=8081

app.observability.environment=${DEPLOYMENT_ENVIRONMENT:local}

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=5000
