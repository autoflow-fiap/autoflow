name: AutoFlow CI

on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

permissions:
  contents: read
  actions: read

jobs:
  backend-build:
    name: Backend tests, build and SonarQube
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ENVIRONMENT: test
      SPRING_APPLICATION_NAME: test-service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: docker info
        name: Verificar Docker para Testcontainers
      - name: Build and test backend, including Flyway integration
        working-directory: backend
        run: mvn -B verify
      - name: SonarQube analysis
        if: ${{ !startsWith(github.ref, 'refs/heads/feature/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=BrunoSousa06_autoflow -Dsonar.qualitygate.wait=true -Dsonar.sources=src/main/java -Dsonar.tests=src/test/java
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/site/jacoco
            backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test:ci
      - working-directory: frontend
        run: npm run build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Testes dos guards, contratos e matriz dos workflows
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend
          if-no-files-found: ignore

  terraform-static:
    name: Terraform formatting and static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Testar matriz dos workflows
        run: python -m unittest discover -s scripts -p "test_ci_cd_workflow_matrix.py" -v
      - name: Validar contrato do backend S3 sem credenciais AWS
        run: python -m unittest discover -s scripts -p "test_terraform_backend_config.py" -v
      - name: Verificar formatação Terraform
        run: terraform fmt -check -recursive infra
      - name: Validar configuração em backend isolado
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

  docker-build:
    name: Build Docker images without publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend-build, frontend-build, terraform-static]
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem backend sem publicação
        run: docker build --file backend/Dockerfile --tag autoflow-backend:${{ github.sha }} backend
      - name: Build da imagem frontend sem publicação
        run: docker build --file frontend/Dockerfile --tag autoflow-frontend:${{ github.sha }} frontend

  snyk-scan:
    name: Snyk security scan
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
      - name: Snyk Open Source scan
        id: snyk-open-source
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --sarif-file-output=snyk-open-source.sarif
      - name: Publicar alertas Snyk Open Source
        if: always() && hashFiles('snyk-open-source.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-open-source.sarif
      - name: Build backend image for container scan
        run: docker build --file backend/Dockerfile --tag autoflow-backend:${{ github.sha }} backend
      - name: Snyk container scan
        id: snyk-container
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test autoflow-backend:${{ github.sha }} --file=backend/Dockerfile --sarif-file-output=snyk-container.sarif
      - name: Publicar alertas Snyk Container
        if: always() && hashFiles('snyk-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-container.sarif
