apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoflow-backend
  labels:
    app: autoflow-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoflow-backend
  template:
    metadata:
      annotations:
        checksum/gateway-origin: "${gateway_origin_hash}"
      labels:
        app: autoflow-backend
    spec:
      containers:
        - name: autoflow-backend-container
          image: ${dockerhub_username}/autoflow-backend:${image_tag}
          imagePullPolicy: Always
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: autoflow-config
            - secretRef:
                name: autoflow-secrets
          env:
            - name: NEW_RELIC_REQUIRED
              value: "true"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license
                  key: licenseKey
                  optional: true
            - name: NEW_RELIC_APP_NAME
              value: autoflow-backend
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "false"
            - name: NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED
              value: "true"
            - name: NEW_RELIC_LABELS
              valueFrom:
                configMapKeyRef:
                  name: autoflow-config
                  key: NEW_RELIC_LABELS
                  optional: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            failureThreshold: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            timeoutSeconds: 5
            periodSeconds: 30
