apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoflow-frontend
  labels:
    app: autoflow-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoflow-frontend
  template:
    metadata:
      annotations:
        checksum/gateway-nginx: "${gateway_nginx_hash}"
      labels:
        app: autoflow-frontend
    spec:
      volumes:
        - name: gateway-nginx
          configMap:
            name: autoflow-gateway-nginx
      containers:
        - name: autoflow-frontend-container
          image: ${dockerhub_username}/autoflow-frontend:${image_tag}
          imagePullPolicy: Always
          volumeMounts:
            - name: gateway-nginx
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            failureThreshold: 3
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10 
            periodSeconds: 30
