server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Queries podem conter tokens de acompanhamento; não registrar requisições.
    access_log off;
    error_log /dev/stderr crit;

    location = / { try_files /index.html =404; }
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location ^~ /auth/ { return 404; }
    location ~ ^/(actuator|swagger-ui|swagger-resources|v3|webjars|metrics|admin)(/|$) { return 404; }

    # Apenas rotas Angular conhecidas recebem fallback da SPA.
    location ~ ^/(login|dashboard|clientes|usuarios|veiculos|servicos|peca-insumo|reparos-adicionais|ordens-servico(/[^/]+)?|orcamentos(/[^/]+)?|minha-conta(/minhas-ordens(/[^/]+)?)?|public/acompanhamento|public/orcamentos/[^/]+)$ {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
    location / { return 404; }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
